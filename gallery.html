<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PVP Gaming Gallery - Collection of amazing gaming moments">
    <meta name="theme-color" content="#00ff88">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="">

    <title>Gallery </title>

    <!-- <script src="important.js" defer></script> -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

</head>

<body>
    <!-- <div class="floating-blobs"></div> -->

    <!-- <div class="stars"></div>
    <div class="aurora-bg"></div> -->

    <header class="main-header">
        <div class="logo-section">
            <a href="index.html" class="logo-link">
                <div class="Logo">
                    <img class="hello" height="100" width="100" src="Untitled design (4).png" alt="PVP Gaming Logo">

                </div>
            </a>
            <a href="index.html" class="logo-link">
                <h1 id="PVPGaming">PVP Gaming</h1>
            </a>
        </div>

        <button id="menu-toggle" class="hamburger"><span></span></button>

        <div class="nav-menu" id="navMenu">
            <a class="gallery-button-container">
                <a href="index.html" class="glow-button">Home</a>
            </a>
            <a href="https://www.youtube.com/@PVP.Gaming" target="_blank">
                <img src="yt (2).webp" alt="YouTube"> <span>YouTube</span>
            </a>
            <a href="https://discord.gg/SKMtzmrRkJ" target="_blank">
                <img class="discord" src="dis-removebg-preview.webp" alt="Discord"> <span>Discord</span>
            </a>
            <a href="https://www.instagram.com/pvp_gaming001/" target="_blank">
                <img src="insta (3).svg" alt="Instagram"> <span>Instagram </span>
            </a>
        </div>
    </header>




    <!-- <div class="loading-animation"></div> -->
    <!-- ✅ Single Lightbox -->
    <div id="lightbox" class="lightbox">
        <!-- <span class="close-lightbox" onclick="closePopup()">&times;</span> -->
        <button id="close-lightbox">❌</button>
        <div class="lightbox-content">
            <!-- <img id="lightbox-img" src="" alt=""> -->


            <!-- ✅ Buttons ko image ke side aur top align karne ke liye wrapper -->
            <div class="lightbox-overlay-controls">
            </div>
            
            <div class="lightbxx">
                <button id="share-btn" onclick="shareImage()"><img height="60px" width="84px"
                    src="share-arrow-svgrepo-com (1).svg" alt=""></button>
                    <button id="download-btn"> <img height="60px" width="84px" src="download-alt-svgrepo-com (1).svg" alt=""
                        onclick="downloadImage()"></button>
                        <img id="lightbox-img" src="" alt="Image">
                        <div id="thumbnail-strip"></div>
                        
                    </div>
                </div>

    </div>


    <button id="theme-toggle">Change Theme</button>




    <div class="boundary">
        <div class="background-section" id="background-section">
            <div class="background">

                <div class="material">
                    <!-- <button id="darkModeToggle"><img height="50px" width="50px" src="light_mode .webp" alt=""> </button> -->
                    <div class="galleryHeader" id="typewriter-text" data-text="Gallery" style="--speed: 3s;"></div>
                    <div class="glow-bar"></div>
                </div>

                <div class="search-container">
                    <input type="text" class="search" id="imageSearch" placeholder="Search images...">
                    <span id="search-icon">
                        <img src="search-svgrepo-com (1).svg" alt="search">
                        <span id="clear-search"><img src="cancel-svgrepo-com (1).svg" alt=""></span>

                    </span>
                </div>
                <div class="scroll-indicator" onclick="smoothScrollBy(150)">
                    <div class="chevron chevron1"></div>
                    <div class="chevron chevron2"></div>
                    <div class="chevron chevron3"></div>
                </div>

            </div>
        </div>

        <div class="gallery-container gallery-content">

            <div class="images22 image-grid" data-aos="fade-zoom-in">
                <!-- Add your images here just like you did in index.html -->

            </div>
        </div>
    </div>
    </div>

    <script>
        AOS.init();
    </script>
    <!-- Image Popup -->

    <script src="important.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toggle = document.getElementById("theme-toggle");
            const particles = document.getElementById("particles-js");
            const backgroundImage = document.querySelector(".background img");
            const body = document.body;

            let whiteTheme = false;

            toggle.addEventListener("click", () => {
                whiteTheme = !whiteTheme;

                if (whiteTheme) {
                    body.classList.add("white-theme");
                    particles.style.display = "none";

                    // Light theme image
                    if (backgroundImage) {
                        backgroundImage.src = "download (1).png"; // <- change to your image
                    }

                } else {
                    body.classList.remove("white-theme");
                    particles.style.display = "block";

                    // Dark theme image
                    if (backgroundImage) {
                        backgroundImage.src = "download (1).png"; // <- change to your image
                    }
                }
            });
        });

    </script>

</body>

</html>
